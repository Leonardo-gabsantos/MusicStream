<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="auth-container">  
        <div class="auth-header">
            <h1>Music<span class="logo-blue">Stream</span> <span class="subtitle">- Seu streaming de músicas</span></h1>
        </div>
        
        <div class="auth-card">
            <h2 class="card-title">Login</h2>

            <form action="#" method="post" class="auth-form">
                <input type="email" name="email" placeholder="Digite seu email" class="input-pill" required>
                <input type="password" name="senha" placeholder="Digite sua senha" class="input-pill" required>
                
                <button type="submit" class="btn_submit">Entrar</button>
            </form>

            <div class="auth-footer">
                <p>Ainda não possui conta? <a href="{{ url_for('cadastro') }}">Criar</a></p>
            </div>
        </div>
    </div>

</body>
</html>
